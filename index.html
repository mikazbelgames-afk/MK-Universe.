<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MK Universe Studio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --rosa-claro: #ffd0ea;
            --rosa: #ff8fcf;
            --morado: #7f4ba0;
            --panel: rgba(31, 21, 39, 0.97);
            --borde: rgba(255, 190, 230, 0.45);
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #291a35 0%,
                    #100b14 60%,
                    #08060a 100%
                );

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 24px;
            padding: 20px;
        }

        /* ========================================
           ESCENARIO VERTICAL
        ======================================== */

        .escenario {
            position: relative;

            height: 92vh;
            max-height: 900px;

            aspect-ratio: 9 / 16;

            overflow: hidden;

            background: #000;

            border: 2px solid rgba(255, 190, 230, 0.65);
            border-radius: 18px;

            box-shadow:
                0 0 25px rgba(255, 105, 190, 0.25),
                0 20px 50px rgba(0, 0, 0, 0.45);
        }

        /* CONTENEDOR DE CADA CAPA */

        .capa-contenedor {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(var(--rotacion, 0deg));

            pointer-events: none;
            user-select: none;
        }

        /* IMAGEN INTERIOR */

        .capa-imagen {
            display: block;

            width: 100%;
            height: auto;

            pointer-events: none;
            user-select: none;

            transform-origin: center center;
        }

        /* FONDO COMPLETO */

        .capa-fondo {
            inset: 0;

            width: 100%;
            height: 100%;

            transform: none;
        }

        .capa-fondo .capa-imagen {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* ========================================
           ANIMACIONES
        ======================================== */

        .animacion-ninguna {
            animation: none;
        }

        .animacion-respirar {
            animation:
                respirar var(--velocidad, 6s)
                ease-in-out infinite;
        }

        .animacion-flotar {
            animation:
                flotar var(--velocidad, 6s)
                ease-in-out infinite;
        }

        .animacion-horizontal {
            animation:
                moverHorizontal var(--velocidad, 10s)
                ease-in-out infinite;
        }

        .animacion-pulso {
            animation:
                pulsoLuz var(--velocidad, 5s)
                ease-in-out infinite;
        }

        .animacion-niebla {
            animation:
                nieblaSuave var(--velocidad, 14s)
                ease-in-out infinite;
        }

        @keyframes respirar {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform:
                    scale(
                        calc(
                            1 + var(--intensidad-escala, 0.02)
                        )
                    );
            }
        }

        @keyframes flotar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform:
                    translateY(
                        calc(
                            var(--intensidad-px, 5px) * -1
                        )
                    );
            }
        }

        @keyframes moverHorizontal {

            0%,
            100% {
                transform:
                    translateX(
                        calc(
                            var(--intensidad-px, 5px) * -1
                        )
                    );
            }

            50% {
                transform:
                    translateX(
                        var(--intensidad-px, 5px)
                    );
            }
        }

        @keyframes pulsoLuz {

            0%,
            100% {
                opacity: 0.75;
                transform: scale(1);
            }

            50% {
                opacity: 1;

                transform:
                    scale(
                        calc(
                            1 + var(--intensidad-escala, 0.03)
                        )
                    );
            }
        }

        @keyframes nieblaSuave {

            0%,
            100% {
                transform:
                    translateX(
                        calc(
                            var(--intensidad-px, 8px) * -1
                        )
                    )
                    scale(1.01);
            }

            50% {
                transform:
                    translateX(
                        var(--intensidad-px, 8px)
                    )
                    scale(1.03);
            }
        }

        body.animaciones-pausadas .capa-imagen {
            animation-play-state: paused !important;
        }

        /* ========================================
           PANEL
        ======================================== */

        .panel {
            width: 335px;
            max-height: 92vh;

            overflow-y: auto;

            padding: 21px;

            background: var(--panel);

            border: 1px solid var(--borde);
            border-radius: 18px;

            box-shadow:
                0 0 25px rgba(0, 0, 0, 0.45);
        }

        .panel::-webkit-scrollbar {
            width: 8px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: rgba(255, 190, 230, 0.25);
            border-radius: 20px;
        }

        .encabezado-panel {
            margin-bottom: 20px;
        }

        .encabezado-panel h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .encabezado-panel p {
            margin: 0;
            color: #d8c6dd;
            font-size: 14px;
        }

        .seccion {
            margin-bottom: 18px;
            padding: 16px;

            background: rgba(255, 255, 255, 0.045);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }

        .seccion h2 {
            margin: 0 0 15px;

            color: var(--rosa-claro);

            font-size: 17px;
        }

        .control {
            margin-bottom: 15px;
        }

        .control:last-child {
            margin-bottom: 0;
        }

        .control label {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 12px;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: bold;
        }

        .valor {
            color: var(--rosa-claro);
            font-weight: normal;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--rosa);
            cursor: pointer;
        }

        select {
            width: 100%;

            padding: 9px;

            border: 1px solid rgba(255, 190, 230, 0.35);
            border-radius: 9px;

            background: #24172d;
            color: white;

            cursor: pointer;
        }

        .interruptor {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 15px;

            font-size: 14px;
            font-weight: bold;
        }

        .interruptor input {
            width: 18px;
            height: 18px;

            accent-color: var(--rosa);
            cursor: pointer;
        }

        .botones {
            display: grid;
            gap: 10px;
        }

        .boton {
            width: 100%;

            padding: 11px 14px;

            border: 1px solid rgba(255, 190, 230, 0.55);
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .boton-principal {
            background: rgba(255, 105, 190, 0.18);
        }

        .boton-flotante {
            display: none;

            position: fixed;
            right: 18px;
            bottom: 18px;

            z-index: 999;

            padding: 12px 16px;

            border: 1px solid var(--borde);
            border-radius: 999px;

            background: rgba(31, 21, 39, 0.97);
            color: white;

            font-weight: bold;
            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .nota {
            margin: 17px 0 0;

            color: #bfaec5;

            font-size: 12px;
            line-height: 1.5;
        }

        body.modo-vista .panel {
            display: none;
        }

        body.modo-vista .boton-flotante {
            display: block;
        }

        body.modo-vista {
            gap: 0;
        }

        @media (max-width: 800px) {

            body {
                flex-direction: column;
                justify-content: flex-start;
            }

            .escenario {
                width: min(92vw, 420px);
                height: auto;
            }

            .panel {
                width: min(92vw, 420px);
                max-height: none;
            }

            body.modo-vista {
                justify-content: center;
            }
        }

    </style>
</head>

<body>

    <main
        id="escenario"
        class="escenario"
    ></main>


    <aside class="panel">

        <header class="encabezado-panel">

            <h1>🌸 MK Universe Studio</h1>

            <p>
                Editor vertical para TikTok
            </p>

        </header>


        <div id="panelCapas"></div>


        <div class="botones">

            <button
                id="pausarAnimaciones"
                class="boton"
                type="button"
            >
                ⏸️ Pausar animaciones
            </button>

            <button
                id="ocultarPanel"
                class="boton boton-principal"
                type="button"
            >
                👁️ Ver escena sin controles
            </button>

            <button
                id="restablecer"
                class="boton"
                type="button"
            >
                ↩️ Restablecer valores
            </button>

        </div>


        <p class="nota">

            El halo tiene un orden inferior al volcán,
            por lo que ahora se verá detrás.

            Los valores se guardan automáticamente
            en este navegador.

        </p>

    </aside>


    <button
        id="mostrarPanel"
        class="boton-flotante"
        type="button"
    >
        🎛️ Mostrar controles
    </button>


    <script>

        /* ========================================
           LISTA DE CAPAS
        ========================================

           ORDEN:
           El número "orden" define qué queda delante.

           Cuanto mayor sea el número,
           más adelante aparecerá la capa.
        ======================================== */

        const capas = [

            {
                id: "gradiente",
                nombre: "🌅 Fondo degradado",
                archivo: "Atardecer abstracto y suave.png",

                tipo: "fondo",
                orden: 0,
                mezcla: "normal",

                visible: true,

                tamano: 100,
                x: 50,
                y: 50,
                rotacion: 0,

                opacidad: 100,
                brillo: 80,
                contraste: 100,
                saturacion: 90,

                animacion: "ninguna",
                velocidad: 10,
                intensidad: 2
            },

            {
                id: "halo",
                nombre: "✨ Halo del volcán",
                archivo:
                    "Montaña silueteada con resplandor rosa.png",

                tipo: "elemento",
                orden: 1,
                mezcla: "screen",

                visible: true,

                tamano: 65,
                x: 50,
                y: 47,
                rotacion: 0,

                opacidad: 75,
                brillo: 100,
                contraste: 100,
                saturacion: 100,

                animacion: "pulso",
                velocidad: 7,
                intensidad: 2
            },

            {
                id: "volcan",
                nombre: "🌋 Volcán",
                archivo:
                    "Montaña neón en niebla rosa.png",

                tipo: "elemento",
                orden: 2,
                mezcla: "screen",

                visible: true,

                tamano: 65,
                x: 50,
                y: 47,
                rotacion: 0,

                opacidad: 100,
                brillo: 100,
                contraste: 100,
                saturacion: 100,

                animacion: "ninguna",
                velocidad: 8,
                intensidad: 1
            }

        ];


        const escenario =
            document.getElementById("escenario");

        const panelCapas =
            document.getElementById("panelCapas");

        const botonPausar =
            document.getElementById("pausarAnimaciones");

        let animacionesPausadas = false;


        /* ========================================
           CREAR CAPAS
        ======================================== */

        function crearCapas() {

            escenario.innerHTML = "";

            capas
                .sort(function (a, b) {
                    return a.orden - b.orden;
                })
                .forEach(function (capa) {

                    const contenedor =
                        document.createElement("div");

                    contenedor.id =
                        "contenedor-" + capa.id;

                    contenedor.className =
                        "capa-contenedor";

                    if (capa.tipo === "fondo") {
                        contenedor.classList.add(
                            "capa-fondo"
                        );
                    }

                    contenedor.style.zIndex =
                        capa.orden;

                    const imagen =
                        document.createElement("img");

                    imagen.id =
                        "imagen-" + capa.id;

                    imagen.className =
                        "capa-imagen";

                    imagen.src =
                        capa.archivo;

                    imagen.alt =
                        capa.nombre;

                    contenedor.appendChild(imagen);
                    escenario.appendChild(contenedor);

                });

        }


        /* ========================================
           CREAR CONTROLES AUTOMÁTICAMENTE
        ======================================== */

        function crearPanel() {

            panelCapas.innerHTML = "";

            capas.forEach(function (capa) {

                const seccion =
                    document.createElement("section");

                seccion.className = "seccion";

                seccion.innerHTML = `

                    <h2>${capa.nombre}</h2>

                    <div class="interruptor">

                        <input
                            type="checkbox"
                            id="${capa.id}-visible"
                        >

                        <label for="${capa.id}-visible">
                            Mostrar capa
                        </label>

                    </div>

                    ${
                        capa.tipo !== "fondo"
                        ? crearControlRango(
                            capa.id,
                            "tamano",
                            "Tamaño",
                            10,
                            160,
                            "%"
                        )
                        : ""
                    }

                    ${
                        capa.tipo !== "fondo"
                        ? crearControlRango(
                            capa.id,
                            "x",
                            "Posición horizontal",
                            0,
                            100,
                            "%"
                        )
                        : ""
                    }

                    ${
                        capa.tipo !== "fondo"
                        ? crearControlRango(
                            capa.id,
                            "y",
                            "Posición vertical",
                            0,
                            100,
                            "%"
                        )
                        : ""
                    }

                    ${
                        capa.tipo !== "fondo"
                        ? crearControlRango(
                            capa.id,
                            "rotacion",
                            "Rotación",
                            -30,
                            30,
                            "°"
                        )
                        : ""
                    }

                    ${crearControlRango(
                        capa.id,
                        "opacidad",
                        "Opacidad",
                        0,
                        100,
                        "%"
                    )}

                    ${crearControlRango(
                        capa.id,
                        "brillo",
                        "Brillo",
                        20,
                        200,
                        "%"
                    )}

                    ${crearControlRango(
                        capa.id,
                        "contraste",
                        "Contraste",
                        20,
                        180,
                        "%"
                    )}

                    ${crearControlRango(
                        capa.id,
                        "saturacion",
                        "Intensidad del color",
                        0,
                        200,
                        "%"
                    )}

                    <div class="control">

                        <label for="${capa.id}-animacion">
                            Animación
                        </label>

                        <select id="${capa.id}-animacion">

                            <option value="ninguna">
                                Sin animación
                            </option>

                            <option value="respirar">
                                Respirar suavemente
                            </option>

                            <option value="flotar">
                                Flotar verticalmente
                            </option>

                            <option value="horizontal">
                                Movimiento horizontal
                            </option>

                            <option value="pulso">
                                Pulso de luz
                            </option>

                            <option value="niebla">
                                Niebla suave
                            </option>

                        </select>

                    </div>

                    ${crearControlRango(
                        capa.id,
                        "velocidad",
                        "Duración de animación",
                        2,
                        30,
                        " s"
                    )}

                    ${crearControlRango(
                        capa.id,
                        "intensidad",
                        "Intensidad de movimiento",
                        0,
                        20,
                        ""
                    )}

                `;

                panelCapas.appendChild(seccion);

            });

        }


        function crearControlRango(
            id,
            propiedad,
            texto,
            minimo,
            maximo,
            unidad
        ) {

            return `

                <div class="control">

                    <label for="${id}-${propiedad}">

                        ${texto}

                        <span
                            id="${id}-${propiedad}-valor"
                            class="valor"
                        >
                        </span>

                    </label>

                    <input
                        type="range"
                        id="${id}-${propiedad}"
                        min="${minimo}"
                        max="${maximo}"
                    >

                    <span
                        id="${id}-${propiedad}-unidad"
                        hidden
                    >
                        ${unidad}
                    </span>

                </div>

            `;

        }


        /* ========================================
           COLOCAR VALORES EN LOS CONTROLES
        ======================================== */

        function cargarControles() {

            capas.forEach(function (capa) {

                document.getElementById(
                    capa.id + "-visible"
                ).checked = capa.visible;


                const propiedades = [
                    "tamano",
                    "x",
                    "y",
                    "rotacion",
                    "opacidad",
                    "brillo",
                    "contraste",
                    "saturacion",
                    "velocidad",
                    "intensidad"
                ];


                propiedades.forEach(function (propiedad) {

                    const control =
                        document.getElementById(
                            capa.id + "-" + propiedad
                        );

                    if (control) {
                        control.value =
                            capa[propiedad];
                    }

                });


                document.getElementById(
                    capa.id + "-animacion"
                ).value = capa.animacion;

            });

        }


        /* ========================================
           LEER CONTROLES
        ======================================== */

        function leerControles() {

            capas.forEach(function (capa) {

                capa.visible =
                    document.getElementById(
                        capa.id + "-visible"
                    ).checked;


                const propiedades = [
                    "tamano",
                    "x",
                    "y",
                    "rotacion",
                    "opacidad",
                    "brillo",
                    "contraste",
                    "saturacion",
                    "velocidad",
                    "intensidad"
                ];


                propiedades.forEach(function (propiedad) {

                    const control =
                        document.getElementById(
                            capa.id + "-" + propiedad
                        );

                    if (control) {

                        capa[propiedad] =
                            Number(control.value);

                    }

                });


                capa.animacion =
                    document.getElementById(
                        capa.id + "-animacion"
                    ).value;

            });

        }


        /* ========================================
           ACTUALIZAR ESCENA
        ======================================== */

        function actualizarEscena() {

            leerControles();


            capas.forEach(function (capa) {

                const contenedor =
                    document.getElementById(
                        "contenedor-" + capa.id
                    );

                const imagen =
                    document.getElementById(
                        "imagen-" + capa.id
                    );


                contenedor.style.display =
                    capa.visible
                        ? "block"
                        : "none";


                if (capa.tipo !== "fondo") {

                    contenedor.style.width =
                        capa.tamano + "%";

                    contenedor.style.left =
                        capa.x + "%";

                    contenedor.style.top =
                        capa.y + "%";

                    contenedor.style.setProperty(
                        "--rotacion",
                        capa.rotacion + "deg"
                    );

                }


                imagen.style.opacity =
                    capa.opacidad / 100;


                imagen.style.filter =
                    "brightness(" +
                    capa.brillo +
                    "%) " +

                    "contrast(" +
                    capa.contraste +
                    "%) " +

                    "saturate(" +
                    capa.saturacion +
                    "%)";


                imagen.style.mixBlendMode =
                    capa.mezcla;


                imagen.className =
                    "capa-imagen animacion-" +
                    capa.animacion;


                imagen.style.setProperty(
                    "--velocidad",
                    capa.velocidad + "s"
                );


                imagen.style.setProperty(
                    "--intensidad-px",
                    capa.intensidad + "px"
                );


                imagen.style.setProperty(
                    "--intensidad-escala",
                    capa.intensidad / 100
                );

            });


            actualizarNumeros();
            guardarConfiguracion();

        }


        /* ========================================
           MOSTRAR NÚMEROS
        ======================================== */

        function actualizarNumeros() {

            capas.forEach(function (capa) {

                const unidades = {

                    tamano: "%",
                    x: "%",
                    y: "%",
                    rotacion: "°",
                    opacidad: "%",
                    brillo: "%",
                    contraste: "%",
                    saturacion: "%",
                    velocidad: " s",
                    intensidad: ""

                };


                Object.keys(unidades)
                    .forEach(function (propiedad) {

                        const valor =
                            document.getElementById(
                                capa.id +
                                "-" +
                                propiedad +
                                "-valor"
                            );

                        if (valor) {

                            valor.textContent =
                                capa[propiedad] +
                                unidades[propiedad];

                        }

                    });

            });

        }


        /* ========================================
           GUARDAR Y CARGAR
        ======================================== */

        function guardarConfiguracion() {

            localStorage.setItem(
                "mkUniverseCapasV2",
                JSON.stringify(capas)
            );

        }


        function cargarConfiguracion() {

            const guardado =
                localStorage.getItem(
                    "mkUniverseCapasV2"
                );

            if (!guardado) {
                return;
            }


            try {

                const valores =
                    JSON.parse(guardado);


                valores.forEach(function (guardada) {

                    const capa =
                        capas.find(function (item) {
                            return item.id === guardada.id;
                        });


                    if (capa) {

                        Object.assign(
                            capa,
                            guardada
                        );

                    }

                });

            } catch (error) {

                console.error(
                    "No se pudo cargar la configuración.",
                    error
                );

            }

        }


        /* ========================================
           EVENTOS
        ======================================== */

        panelCapas.addEventListener(
            "input",
            actualizarEscena
        );


        panelCapas.addEventListener(
            "change",
            actualizarEscena
        );


        document.getElementById(
            "ocultarPanel"
        ).addEventListener(
            "click",
            function () {

                document.body.classList.add(
                    "modo-vista"
                );

            }
        );


        document.getElementById(
            "mostrarPanel"
        ).addEventListener(
            "click",
            function () {

                document.body.classList.remove(
                    "modo-vista"
                );

            }
        );


        botonPausar.addEventListener(
            "click",
            function () {

                animacionesPausadas =
                    !animacionesPausadas;


                document.body.classList.toggle(
                    "animaciones-pausadas",
                    animacionesPausadas
                );


                botonPausar.textContent =
                    animacionesPausadas
                        ? "▶️ Reanudar animaciones"
                        : "⏸️ Pausar animaciones";

            }
        );


        document.getElementById(
            "restablecer"
        ).addEventListener(
            "click",
            function () {

                const confirmar =
                    window.confirm(
                        "¿Quieres eliminar los ajustes guardados y volver a los valores iniciales?"
                    );


                if (confirmar) {

                    localStorage.removeItem(
                        "mkUniverseCapasV2"
                    );

                    location.reload();

                }

            }
        );


        /* ========================================
           INICIAR
        ======================================== */

        cargarConfiguracion();
        crearCapas();
        crearPanel();
        cargarControles();
        actualizarEscena();

    </script>

</body>

</html>
