<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MK Universe Studio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --rosa: #ff91ce;
            --rosa-claro: #ffd1ea;
            --panel: rgba(30, 20, 38, 0.97);
            --borde: rgba(255, 196, 231, 0.38);
            --texto-secundario: #c9b6cf;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;

            overflow-x: hidden;

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #2d1d39 0%,
                    #120c18 62%,
                    #08060b 100%
                );
        }

        button,
        input,
        select {
            font: inherit;
        }


        /* =========================================
           ESCENARIO VERTICAL
        ========================================= */

        .escenario {
            position: relative;

            height: 92vh;
            max-height: 900px;

            aspect-ratio: 9 / 16;

            overflow: hidden;
            isolation: isolate;

            background: #000;

            border: 2px solid rgba(255, 194, 229, 0.65);
            border-radius: 18px;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.45),
                0 0 24px rgba(255, 111, 196, 0.20);
        }

        .capa {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 60%;

            transform:
                translate(-50%, -50%)
                rotate(var(--rotacion, 0deg));

            transform-origin: center;

            pointer-events: none;
            user-select: none;
        }

        .capa-fondo {
            inset: 0;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            transform: none;
        }

        .movimiento {
            width: 100%;
            height: 100%;

            transform-origin: center;
        }

        .capa canvas,
        .capa img {
            display: block;

            width: 100%;
            height: auto;

            pointer-events: none;
            user-select: none;
        }

        .capa-fondo canvas,
        .capa-fondo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =========================================
           ANIMACIONES
        ========================================= */

        .animacion-ninguna {
            animation: none;
        }

        .animacion-respirar {
            animation:
                respirar var(--duracion, 8s)
                var(--curva, ease-in-out)
                infinite;
        }

        .animacion-pulso {
            animation:
                pulso var(--duracion, 7s)
                var(--curva, ease-in-out)
                infinite;
        }

        .animacion-flotar {
            animation:
                flotar var(--duracion, 8s)
                var(--curva, ease-in-out)
                infinite;
        }

        .animacion-niebla {
            animation:
                niebla var(--duracion, 16s)
                var(--curva, ease-in-out)
                infinite;
        }

        .animacion-agua {
            animation:
                agua var(--duracion, 10s)
                var(--curva, ease-in-out)
                infinite;
        }

        .animacion-caer {
            animation:
                caer var(--duracion, 12s)
                linear
                infinite;
        }

        .animacion-balanceo {
            animation:
                balanceo var(--duracion, 7s)
                var(--curva, ease-in-out)
                infinite;
        }

        @keyframes respirar {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform:
                    scale(
                        calc(
                            1 + var(--escala-intensidad, 0.02)
                        )
                    );
            }
        }

        @keyframes pulso {

            0%,
            100% {
                opacity:
                    calc(
                        1 - var(--opacidad-intensidad, 0.12)
                    );

                transform: scale(1);
            }

            50% {
                opacity: 1;

                transform:
                    scale(
                        calc(
                            1 + var(--escala-intensidad, 0.02)
                        )
                    );
            }
        }

        @keyframes flotar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform:
                    translateY(
                        calc(
                            var(--movimiento-px, 6px) * -1
                        )
                    );
            }
        }

        @keyframes niebla {

            0%,
            100% {
                transform:
                    translateX(
                        calc(
                            var(--movimiento-px, 10px) * -1
                        )
                    )
                    scale(1.01);
            }

            50% {
                transform:
                    translateX(
                        var(--movimiento-px, 10px)
                    )
                    scale(
                        calc(
                            1 + var(--escala-intensidad, 0.02)
                        )
                    );
            }
        }

        @keyframes agua {

            0%,
            100% {
                transform:
                    translateX(
                        calc(
                            var(--movimiento-px, 5px) * -1
                        )
                    )
                    scaleY(1);
            }

            50% {
                transform:
                    translateX(
                        var(--movimiento-px, 5px)
                    )
                    scaleY(
                        calc(
                            1 + var(--escala-intensidad, 0.015)
                        )
                    );
            }
        }

        @keyframes caer {

            0% {
                transform:
                    translateY(
                        calc(
                            var(--movimiento-px, 12px) * -3
                        )
                    )
                    rotate(-2deg);

                opacity: 0;
            }

            12% {
                opacity: 1;
            }

            88% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(
                        calc(
                            var(--movimiento-px, 12px) * 4
                        )
                    )
                    rotate(3deg);

                opacity: 0;
            }
        }

        @keyframes balanceo {

            0%,
            100% {
                transform: rotate(-1deg);
            }

            50% {
                transform:
                    rotate(
                        calc(
                            var(--rotacion-intensidad, 2deg)
                        )
                    );
            }
        }

        body.animaciones-pausadas .movimiento {
            animation-play-state: paused !important;
        }


        /* =========================================
           PANEL
        ========================================= */

        .panel {
            width: 360px;
            max-height: 92vh;

            overflow-y: auto;

            padding: 20px;

            background: var(--panel);

            border: 1px solid var(--borde);
            border-radius: 18px;

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.40);
        }

        .panel::-webkit-scrollbar {
            width: 8px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: rgba(255, 194, 229, 0.23);
            border-radius: 20px;
        }

        .cabecera h1 {
            margin: 0 0 5px;
            font-size: 23px;
        }

        .cabecera p {
            margin: 0 0 18px;

            color: var(--texto-secundario);
            font-size: 14px;
        }

        .capa-panel,
        .agregar-panel {
            margin-bottom: 16px;
            padding: 15px;

            background: rgba(255, 255, 255, 0.045);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }

        .titulo-capa {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;

            margin-bottom: 13px;
        }

        .titulo-capa h2 {
            margin: 0;

            color: var(--rosa-claro);
            font-size: 16px;
        }

        .orden {
            display: flex;
            gap: 5px;
        }

        .boton-mini {
            min-width: 34px;

            padding: 6px 8px;

            border: 1px solid rgba(255, 194, 229, 0.35);
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.07);
            color: white;

            cursor: pointer;
        }

        .control {
            margin-bottom: 14px;
        }

        .control:last-child {
            margin-bottom: 0;
        }

        .control label {
            display: flex;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: bold;
        }

        .valor {
            color: var(--rosa-claro);
            font-weight: normal;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--rosa);
            cursor: pointer;
        }

        input[type="text"],
        select {
            width: 100%;

            padding: 9px 10px;

            border: 1px solid rgba(255, 194, 229, 0.30);
            border-radius: 9px;

            background: #25182e;
            color: white;
        }

        .interruptor {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 14px;

            font-size: 13px;
            font-weight: bold;
        }

        .interruptor input {
            width: 18px;
            height: 18px;

            accent-color: var(--rosa);
        }

        .botones-generales {
            display: grid;
            gap: 9px;
        }

        .boton {
            width: 100%;

            padding: 11px 13px;

            border: 1px solid rgba(255, 194, 229, 0.48);
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.075);
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover,
        .boton-mini:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .boton-principal {
            background: rgba(255, 117, 194, 0.17);
        }

        .nota {
            margin: 15px 0 0;

            color: var(--texto-secundario);
            font-size: 12px;
            line-height: 1.5;
        }

        .aviso {
            min-height: 18px;
            margin-top: 8px;

            color: var(--rosa-claro);
            font-size: 12px;
        }

        .boton-flotante {
            display: none;

            position: fixed;
            right: 18px;
            bottom: 18px;

            z-index: 9999;

            padding: 11px 15px;

            border: 1px solid var(--borde);
            border-radius: 999px;

            background: var(--panel);
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        body.modo-vista .panel {
            display: none;
        }

        body.modo-vista .boton-flotante {
            display: block;
        }

        body.modo-vista {
            gap: 0;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 850px) {

            body {
                flex-direction: column;
                justify-content: flex-start;
            }

            .escenario {
                width: min(92vw, 430px);
                height: auto;
            }

            .panel {
                width: min(92vw, 430px);
                max-height: none;
            }
        }

    </style>

</head>


<body>

    <main
        id="escenario"
        class="escenario"
        aria-label="Escena vertical del MK Universe"
    ></main>


    <aside class="panel">

        <header class="cabecera">

            <h1>🌸 MK Universe Studio</h1>

            <p>
                Limpieza, orden y animaciones de capas
            </p>

        </header>


        <div id="panelCapas"></div>


        <section class="agregar-panel">

            <div class="titulo-capa">

                <h2>➕ Agregar imagen</h2>

            </div>

            <div class="control">

                <label for="nuevoNombre">
                    Nombre visible
                </label>

                <input
                    id="nuevoNombre"
                    type="text"
                    placeholder="Ejemplo: Niebla frontal"
                >

            </div>

            <div class="control">

                <label for="nuevoArchivo">
                    Nombre exacto del archivo
                </label>

                <input
                    id="nuevoArchivo"
                    type="text"
                    placeholder="Ejemplo: Niebla rosa.png"
                >

            </div>

            <div class="control">

                <label for="nuevoTipo">
                    Tipo de capa
                </label>

                <select id="nuevoTipo">

                    <option value="elemento">
                        Elemento con transparencia
                    </option>

                    <option value="fondo">
                        Fondo completo
                    </option>

                </select>

            </div>

            <button
                id="agregarCapa"
                class="boton boton-principal"
                type="button"
            >
                Añadir al editor
            </button>

            <div
                id="avisoAgregar"
                class="aviso"
                aria-live="polite"
            ></div>

        </section>


        <div class="botones-generales">

            <button
                id="pausar"
                class="boton"
                type="button"
            >
                ⏸️ Pausar animaciones
            </button>

            <button
                id="ocultarPanel"
                class="boton boton-principal"
                type="button"
            >
                👁️ Ver escena sin controles
            </button>

            <button
                id="restablecer"
                class="boton"
                type="button"
            >
                ↩️ Restablecer proyecto
            </button>

        </div>


        <p class="nota">

            La limpieza de negro genera transparencia real mediante
            un canvas. “Umbral” elimina los tonos más oscuros y
            “Suavidad” conserva los bordes del humo y las luces.

        </p>

    </aside>


    <button
        id="mostrarPanel"
        class="boton-flotante"
        type="button"
    >
        🎛️ Mostrar controles
    </button>


    <script>

        /* =========================================
           CAPAS PREDETERMINADAS
        ========================================= */

        const capasIniciales = [

            {
                id: "fondo",
                nombre: "🌅 Fondo degradado",
                archivo: "Atardecer abstracto y suave.png",

                tipo: "fondo",
                visible: true,

                tamano: 100,
                x: 50,
                y: 50,
                rotacion: 0,

                opacidad: 100,
                brillo: 80,
                contraste: 100,
                saturacion: 90,

                limpiarNegro: false,
                umbral: 8,
                suavidad: 32,

                animacion: "ninguna",
                velocidad: 12,
                intensidad: 2,
                plasticidad: 75
            },

            {
                id: "halo",
                nombre: "✨ Halo del volcán",
                archivo:
                    "Montaña silueteada con resplandor rosa.png",

                tipo: "elemento",
                visible: true,

                tamano: 65,
                x: 50,
                y: 47,
                rotacion: 0,

                opacidad: 75,
                brillo: 100,
                contraste: 100,
                saturacion: 100,

                limpiarNegro: true,
                umbral: 10,
                suavidad: 45,

                animacion: "pulso",
                velocidad: 8,
                intensidad: 2,
                plasticidad: 90
            },

            {
                id: "volcan",
                nombre: "🌋 Volcán",
                archivo:
                    "Montaña neón en niebla rosa.png",

                tipo: "elemento",
                visible: true,

                tamano: 65,
                x: 50,
                y: 47,
                rotacion: 0,

                opacidad: 100,
                brillo: 100,
                contraste: 100,
                saturacion: 100,

                limpiarNegro: true,
                umbral: 7,
                suavidad: 30,

                animacion: "ninguna",
                velocidad: 10,
                intensidad: 1,
                plasticidad: 85
            }

        ];


        let capas = JSON.parse(
            JSON.stringify(capasIniciales)
        );

        let animacionesPausadas = false;


        const escenario =
            document.getElementById("escenario");

        const panelCapas =
            document.getElementById("panelCapas");

        const avisoAgregar =
            document.getElementById("avisoAgregar");


        /* =========================================
           HERRAMIENTAS
        ========================================= */

        function limitar(numero, minimo, maximo) {

            return Math.min(
                Math.max(numero, minimo),
                maximo
            );

        }


        function crearId(texto) {

            return (
                texto
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-+|-+$/g, "")
                +
                "-"
                +
                Date.now()
            );

        }


        function curvaSegunPlasticidad(valor) {

            const plasticidad =
                limitar(Number(valor), 0, 100);

            if (plasticidad >= 80) {
                return "cubic-bezier(0.45, 0, 0.55, 1)";
            }

            if (plasticidad >= 55) {
                return "ease-in-out";
            }

            if (plasticidad >= 30) {
                return "ease";
            }

            return "linear";

        }


        /* =========================================
           LIMPIAR FONDO NEGRO
        ========================================= */

        function crearCanvasProcesado(capa, imagen) {

            const canvas =
                document.createElement("canvas");

            const contexto =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently: true
                    }
                );

            canvas.width =
                imagen.naturalWidth;

            canvas.height =
                imagen.naturalHeight;

            contexto.drawImage(
                imagen,
                0,
                0,
                canvas.width,
                canvas.height
            );


            if (!capa.limpiarNegro) {
                return canvas;
            }


            try {

                const datosImagen =
                    contexto.getImageData(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                const datos =
                    datosImagen.data;

                const umbral =
                    Number(capa.umbral);

                const suavidad =
                    Math.max(
                        Number(capa.suavidad),
                        1
                    );


                for (
                    let indice = 0;
                    indice < datos.length;
                    indice += 4
                ) {

                    const rojo =
                        datos[indice];

                    const verde =
                        datos[indice + 1];

                    const azul =
                        datos[indice + 2];

                    const alfaOriginal =
                        datos[indice + 3];


                    const luminosidad =
                        Math.max(
                            rojo,
                            verde,
                            azul
                        );


                    let factorAlfa =
                        (
                            luminosidad - umbral
                        )
                        /
                        suavidad;


                    factorAlfa =
                        limitar(
                            factorAlfa,
                            0,
                            1
                        );


                    factorAlfa =
                        factorAlfa
                        *
                        factorAlfa
                        *
                        (
                            3
                            -
                            2
                            *
                            factorAlfa
                        );


                    datos[indice + 3] =
                        Math.round(
                            alfaOriginal
                            *
                            factorAlfa
                        );

                }


                contexto.putImageData(
                    datosImagen,
                    0,
                    0
                );

            } catch (error) {

                console.error(
                    "No se pudo limpiar el fondo:",
                    capa.archivo,
                    error
                );

            }


            return canvas;

        }


        /* =========================================
           CREAR ESCENA
        ========================================= */

        function crearEscena() {

            escenario.innerHTML = "";


            capas.forEach(function (capa, indice) {

                const contenedor =
                    document.createElement("div");

                contenedor.id =
                    "capa-" + capa.id;

                contenedor.className =
                    capa.tipo === "fondo"
                        ? "capa capa-fondo"
                        : "capa";

                contenedor.style.zIndex =
                    indice;


                const movimiento =
                    document.createElement("div");

                movimiento.id =
                    "movimiento-" + capa.id;

                movimiento.className =
                    "movimiento animacion-" +
                    capa.animacion;


                const imagen =
                    new Image();

                imagen.alt =
                    capa.nombre;


                imagen.addEventListener(
                    "load",
                    function () {

                        const canvas =
                            crearCanvasProcesado(
                                capa,
                                imagen
                            );

                        canvas.id =
                            "visual-" + capa.id;

                        movimiento.innerHTML = "";
                        movimiento.appendChild(canvas);

                        actualizarCapaVisual(capa);

                    }
                );


                imagen.addEventListener(
                    "error",
                    function () {

                        movimiento.innerHTML = "";

                        const mensaje =
                            document.createElement("div");

                        mensaje.style.padding =
                            "12px";

                        mensaje.style.color =
                            "white";

                        mensaje.style.background =
                            "rgba(150, 20, 70, 0.75)";

                        mensaje.textContent =
                            "No se encontró: "
                            +
                            capa.archivo;

                        movimiento.appendChild(mensaje);

                    }
                );


                imagen.src =
                    capa.archivo;


                contenedor.appendChild(movimiento);
                escenario.appendChild(contenedor);

            });


            actualizarTodaLaEscena();

        }


        /* =========================================
           ACTUALIZAR UNA CAPA
        ========================================= */

        function actualizarCapaVisual(capa) {

            const contenedor =
                document.getElementById(
                    "capa-" + capa.id
                );

            const movimiento =
                document.getElementById(
                    "movimiento-" + capa.id
                );

            const visual =
                document.getElementById(
                    "visual-" + capa.id
                );


            if (!contenedor || !movimiento) {
                return;
            }


            contenedor.style.display =
                capa.visible
                    ? "block"
                    : "none";


            if (capa.tipo !== "fondo") {

                contenedor.style.width =
                    capa.tamano + "%";

                contenedor.style.left =
                    capa.x + "%";

                contenedor.style.top =
                    capa.y + "%";

                contenedor.style.setProperty(
                    "--rotacion",
                    capa.rotacion + "deg"
                );

            }


            movimiento.className =
                "movimiento animacion-" +
                capa.animacion;


            movimiento.style.setProperty(
                "--duracion",
                capa.velocidad + "s"
            );

            movimiento.style.setProperty(
                "--movimiento-px",
                capa.intensidad + "px"
            );

            movimiento.style.setProperty(
                "--escala-intensidad",
                capa.intensidad / 100
            );

            movimiento.style.setProperty(
                "--opacidad-intensidad",
                Math.min(
                    capa.intensidad / 100,
                    0.35
                )
            );

            movimiento.style.setProperty(
                "--rotacion-intensidad",
                Math.max(
                    capa.intensidad / 3,
                    1
                )
                +
                "deg"
            );

            movimiento.style.setProperty(
                "--curva",
                curvaSegunPlasticidad(
                    capa.plasticidad
                )
            );


            if (visual) {

                visual.style.opacity =
                    capa.opacidad / 100;

                visual.style.filter =
                    "brightness("
                    +
                    capa.brillo
                    +
                    "%) "
                    +
                    "contrast("
                    +
                    capa.contraste
                    +
                    "%) "
                    +
                    "saturate("
                    +
                    capa.saturacion
                    +
                    "%)";

            }

        }


        function actualizarTodaLaEscena() {

            capas.forEach(
                actualizarCapaVisual
            );

            guardarProyecto();

        }


        /* =========================================
           PANEL DE CAPAS
        ========================================= */

        function crearControlRango(
            capa,
            propiedad,
            nombre,
            minimo,
            maximo,
            unidad
        ) {

            return `

                <div class="control">

                    <label for="${capa.id}-${propiedad}">

                        ${nombre}

                        <span
                            id="${capa.id}-${propiedad}-valor"
                            class="valor"
                        >
                            ${capa[propiedad]}${unidad}
                        </span>

                    </label>

                    <input
                        id="${capa.id}-${propiedad}"
                        data-id="${capa.id}"
                        data-propiedad="${propiedad}"
                        data-reprocesar="${
                            propiedad === "umbral"
                            ||
                            propiedad === "suavidad"
                        }"
                        type="range"
                        min="${minimo}"
                        max="${maximo}"
                        value="${capa[propiedad]}"
                    >

                </div>

            `;

        }


        function crearPanel() {

            panelCapas.innerHTML = "";


            capas
                .slice()
                .reverse()
                .forEach(function (capa) {

                    const indiceReal =
                        capas.findIndex(
                            item =>
                                item.id === capa.id
                        );


                    const seccion =
                        document.createElement("section");

                    seccion.className =
                        "capa-panel";

                    seccion.innerHTML = `

                        <div class="titulo-capa">

                            <h2>${capa.nombre}</h2>

                            <div class="orden">

                                <button
                                    class="boton-mini subir"
                                    data-id="${capa.id}"
                                    type="button"
                                    title="Mover hacia delante"
                                >
                                    ▲
                                </button>

                                <button
                                    class="boton-mini bajar"
                                    data-id="${capa.id}"
                                    type="button"
                                    title="Mover hacia atrás"
                                >
                                    ▼
                                </button>

                            </div>

                        </div>


                        <div class="interruptor">

                            <input
                                id="${capa.id}-visible"
                                data-id="${capa.id}"
                                data-propiedad="visible"
                                type="checkbox"
                                ${
                                    capa.visible
                                        ? "checked"
                                        : ""
                                }
                            >

                            <label for="${capa.id}-visible">
                                Mostrar capa
                            </label>

                        </div>


                        ${
                            capa.tipo !== "fondo"
                                ? crearControlRango(
                                    capa,
                                    "tamano",
                                    "Tamaño",
                                    10,
                                    180,
                                    "%"
                                )
                                : ""
                        }

                        ${
                            capa.tipo !== "fondo"
                                ? crearControlRango(
                                    capa,
                                    "x",
                                    "Posición horizontal",
                                    -20,
                                    120,
                                    "%"
                                )
                                : ""
                        }

                        ${
                            capa.tipo !== "fondo"
                                ? crearControlRango(
                                    capa,
                                    "y",
                                    "Posición vertical",
                                    -20,
                                    120,
                                    "%"
                                )
                                : ""
                        }

                        ${
                            capa.tipo !== "fondo"
                                ? crearControlRango(
                                    capa,
                                    "rotacion",
                                    "Rotación",
                                    -45,
                                    45,
                                    "°"
                                )
                                : ""
                        }


                        ${crearControlRango(
                            capa,
                            "opacidad",
                            "Opacidad",
                            0,
                            100,
                            "%"
                        )}

                        ${crearControlRango(
                            capa,
                            "brillo",
                            "Brillo",
                            20,
                            200,
                            "%"
                        )}

                        ${crearControlRango(
                            capa,
                            "contraste",
                            "Contraste",
                            20,
                            200,
                            "%"
                        )}

                        ${crearControlRango(
                            capa,
                            "saturacion",
                            "Intensidad del color",
                            0,
                            220,
                            "%"
                        )}


                        <div class="interruptor">

                            <input
                                id="${capa.id}-limpiarNegro"
                                data-id="${capa.id}"
                                data-propiedad="limpiarNegro"
                                data-reprocesar="true"
                                type="checkbox"
                                ${
                                    capa.limpiarNegro
                                        ? "checked"
                                        : ""
                                }
                            >

                            <label for="${capa.id}-limpiarNegro">
                                Eliminar fondo negro
                            </label>

                        </div>


                        ${crearControlRango(
                            capa,
                            "umbral",
                            "Cantidad de negro a eliminar",
                            0,
                            100,
                            ""
                        )}

                        ${crearControlRango(
                            capa,
                            "suavidad",
                            "Suavidad de los bordes",
                            1,
                            120,
                            ""
                        )}


                        <div class="control">

                            <label for="${capa.id}-animacion">
                                Animación
                            </label>

                            <select
                                id="${capa.id}-animacion"
                                data-id="${capa.id}"
                                data-propiedad="animacion"
                            >

                                <option value="ninguna">
                                    Sin animación
                                </option>

                                <option value="respirar">
                                    Respirar suavemente
                                </option>

                                <option value="pulso">
                                    Pulso de luz
                                </option>

                                <option value="flotar">
                                    Flotar verticalmente
                                </option>

                                <option value="niebla">
                                    Desplazamiento de niebla
                                </option>

                                <option value="agua">
                                    Movimiento de agua
                                </option>

                                <option value="caer">
                                    Caída de flores u hojas
                                </option>

                                <option value="balanceo">
                                    Balanceo delicado
                                </option>

                            </select>

                        </div>


                        ${crearControlRango(
                            capa,
                            "velocidad",
                            "Duración",
                            2,
                            40,
                            " s"
                        )}

                        ${crearControlRango(
                            capa,
                            "intensidad",
                            "Intensidad",
                            0,
                            40,
                            ""
                        )}

                        ${crearControlRango(
                            capa,
                            "plasticidad",
                            "Suavidad o plasticidad",
                            0,
                            100,
                            "%"
                        )}


                        ${
                            capa.tipo !== "fondo"
                                ? `
                                    <button
                                        class="boton eliminar"
                                        data-id="${capa.id}"
                                        type="button"
                                    >
                                        🗑️ Eliminar capa
                                    </button>
                                `
                                : ""
                        }

                    `;


                    panelCapas.appendChild(
                        seccion
                    );


                    const selectorAnimacion =
                        seccion.querySelector(
                            "#" +
                            capa.id +
                            "-animacion"
                        );

                    selectorAnimacion.value =
                        capa.animacion;

                });

        }


        /* =========================================
           REPROCESAR IMAGEN
        ========================================= */

        function reprocesarCapa(capa) {

            const movimiento =
                document.getElementById(
                    "movimiento-" + capa.id
                );

            if (!movimiento) {
                return;
            }


            const imagen =
                new Image();


            imagen.addEventListener(
                "load",
                function () {

                    const canvas =
                        crearCanvasProcesado(
                            capa,
                            imagen
                        );

                    canvas.id =
                        "visual-" + capa.id;

                    movimiento.innerHTML = "";
                    movimiento.appendChild(canvas);

                    actualizarCapaVisual(capa);

                }
            );


            imagen.src =
                capa.archivo;

        }


        /* =========================================
           EVENTOS DEL PANEL
        ========================================= */

        panelCapas.addEventListener(
            "input",
            function (evento) {

                const objetivo =
                    evento.target;

                const id =
                    objetivo.dataset.id;

                const propiedad =
                    objetivo.dataset.propiedad;


                if (!id || !propiedad) {
                    return;
                }


                const capa =
                    capas.find(
                        item =>
                            item.id === id
                    );


                if (!capa) {
                    return;
                }


                if (objetivo.type === "checkbox") {

                    capa[propiedad] =
                        objetivo.checked;

                } else if (
                    objetivo.type === "range"
                ) {

                    capa[propiedad] =
                        Number(objetivo.value);

                    const valor =
                        document.getElementById(
                            id
                            +
                            "-"
                            +
                            propiedad
                            +
                            "-valor"
                        );

                    if (valor) {

                        const unidades = {

                            tamano: "%",
                            x: "%",
                            y: "%",
                            rotacion: "°",
                            opacidad: "%",
                            brillo: "%",
                            contraste: "%",
                            saturacion: "%",
                            velocidad: " s",
                            intensidad: "",
                            plasticidad: "%",
                            umbral: "",
                            suavidad: ""

                        };

                        valor.textContent =
                            capa[propiedad]
                            +
                            (
                                unidades[propiedad]
                                ??
                                ""
                            );

                    }

                } else {

                    capa[propiedad] =
                        objetivo.value;

                }


                if (
                    objetivo.dataset.reprocesar
                    ===
                    "true"
                ) {

                    reprocesarCapa(capa);

                } else {

                    actualizarCapaVisual(capa);
                    guardarProyecto();

                }

            }
        );


        panelCapas.addEventListener(
            "change",
            function (evento) {

                const objetivo =
                    evento.target;

                if (
                    objetivo.dataset.reprocesar
                    ===
                    "true"
                ) {

                    const capa =
                        capas.find(
                            item =>
                                item.id
                                ===
                                objetivo.dataset.id
                        );

                    if (capa) {
                        reprocesarCapa(capa);
                        guardarProyecto();
                    }

                }

            }
        );


        panelCapas.addEventListener(
            "click",
            function (evento) {

                const boton =
                    evento.target.closest("button");

                if (!boton) {
                    return;
                }


                const id =
                    boton.dataset.id;

                const indice =
                    capas.findIndex(
                        item =>
                            item.id === id
                    );


                if (indice === -1) {
                    return;
                }


                if (
                    boton.classList.contains("subir")
                    &&
                    indice < capas.length - 1
                ) {

                    const temporal =
                        capas[indice];

                    capas[indice] =
                        capas[indice + 1];

                    capas[indice + 1] =
                        temporal;

                }


                if (
                    boton.classList.contains("bajar")
                    &&
                    indice > 0
                ) {

                    const temporal =
                        capas[indice];

                    capas[indice] =
                        capas[indice - 1];

                    capas[indice - 1] =
                        temporal;

                }


                if (
                    boton.classList.contains("eliminar")
                ) {

                    const confirmar =
                        window.confirm(
                            "¿Quieres eliminar esta capa del editor?"
                        );

                    if (!confirmar) {
                        return;
                    }

                    capas.splice(indice, 1);

                }


                guardarProyecto();
                crearEscena();
                crearPanel();

            }
        );


        /* =========================================
           AGREGAR NUEVAS CAPAS
        ========================================= */

        document.getElementById(
            "agregarCapa"
        ).addEventListener(
            "click",
            function () {

                const nombre =
                    document
                        .getElementById("nuevoNombre")
                        .value
                        .trim();

                const archivo =
                    document
                        .getElementById("nuevoArchivo")
                        .value
                        .trim();

                const tipo =
                    document
                        .getElementById("nuevoTipo")
                        .value;


                if (!nombre || !archivo) {

                    avisoAgregar.textContent =
                        "Escribe el nombre y el archivo exacto.";

                    return;
                }


                capas.push({

                    id: crearId(nombre),
                    nombre: nombre,
                    archivo: archivo,

                    tipo: tipo,
                    visible: true,

                    tamano:
                        tipo === "fondo"
                            ? 100
                            : 80,

                    x: 50,
                    y: 50,
                    rotacion: 0,

                    opacidad: 100,
                    brillo: 100,
                    contraste: 100,
                    saturacion: 100,

                    limpiarNegro:
                        tipo !== "fondo",

                    umbral: 8,
                    suavidad: 35,

                    animacion: "ninguna",
                    velocidad: 12,
                    intensidad: 4,
                    plasticidad: 80

                });


                document.getElementById(
                    "nuevoNombre"
                ).value = "";

                document.getElementById(
                    "nuevoArchivo"
                ).value = "";


                avisoAgregar.textContent =
                    "Capa añadida. Si no aparece, revisa el nombre exacto del archivo.";


                guardarProyecto();
                crearEscena();
                crearPanel();

            }
        );


        /* =========================================
           GUARDAR Y CARGAR
        ========================================= */

        function guardarProyecto() {

            localStorage.setItem(
                "mkUniverseStudioV4",
                JSON.stringify(capas)
            );

        }


        function cargarProyecto() {

            const guardado =
                localStorage.getItem(
                    "mkUniverseStudioV4"
                );


            if (!guardado) {
                return;
            }


            try {

                const datos =
                    JSON.parse(guardado);

                if (Array.isArray(datos)) {
                    capas = datos;
                }

            } catch (error) {

                console.error(
                    "No se pudo cargar el proyecto.",
                    error
                );

            }

        }


        /* =========================================
           BOTONES GENERALES
        ========================================= */

        document.getElementById(
            "pausar"
        ).addEventListener(
            "click",
            function (evento) {

                animacionesPausadas =
                    !animacionesPausadas;


                document.body.classList.toggle(
                    "animaciones-pausadas",
                    animacionesPausadas
                );


                evento.currentTarget.textContent =
                    animacionesPausadas
                        ? "▶️ Reanudar animaciones"
                        : "⏸️ Pausar animaciones";

            }
        );


        document.getElementById(
            "ocultarPanel"
        ).addEventListener(
            "click",
            function () {

                document.body.classList.add(
                    "modo-vista"
                );

            }
        );


        document.getElementById(
            "mostrarPanel"
        ).addEventListener(
            "click",
            function () {

                document.body.classList.remove(
                    "modo-vista"
                );

            }
        );


        document.getElementById(
            "restablecer"
        ).addEventListener(
            "click",
            function () {

                const confirmar =
                    window.confirm(
                        "¿Quieres borrar los ajustes guardados y volver a las tres capas iniciales?"
                    );


                if (!confirmar) {
                    return;
                }


                localStorage.removeItem(
                    "mkUniverseStudioV4"
                );


                capas =
                    JSON.parse(
                        JSON.stringify(
                            capasIniciales
                        )
                    );


                crearEscena();
                crearPanel();
                guardarProyecto();

            }
        );


        /* =========================================
           INICIAR
        ========================================= */

        cargarProyecto();
        crearEscena();
        crearPanel();

    </script>

</body>

</html>
