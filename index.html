<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Universe - Prueba 02</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#111;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

        }

        .escenario{

            position:relative;

            aspect-ratio:9/16;

            height:100vh;

            max-width:100vw;

            overflow:hidden;

            background:black;

        }

        .capa{

            position:absolute;

            inset:0;

            width:100%;

            height:100%;

            object-fit:cover;

        }

    </style>

</head>

<body>

<div class="escenario">

    <!-- CAPA 00 -->
    <img
    class="capa"
    src="Atardecer abstracto y suave.png"
    alt="Gradiente">

    <!-- CAPA 01 -->
    <img
    class="capa"
    src="Montaña neon en niebla rosa.png"
    alt="Volcán">

</div>

</body>

</html>
