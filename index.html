<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Universe - Prueba de capas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #08030d;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .escenario {
            position: relative;
            width: min(100vw, 1600px);
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: black;
        }

        .capa {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nombre {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            margin: 0;
            padding: 8px 12px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <main class="escenario">
        <p class="nombre">Prueba 01: Gradiente</p>

        <img
            class="capa"
            src="Atardecer abstracto y suave.png"
            alt="Gradiente del MK Universe"
        >
    </main>

</body>
</html>
