<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MK Universe 2.0 — Motor de Overlays</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0b0710;
      --panel: rgba(27, 19, 35, .98);
      --panel-2: rgba(255,255,255,.05);
      --border: rgba(255, 211, 232, .22);
      --text: #fff7fb;
      --muted: #c7b8c9;
      --accent: #ff9bcf;
      --accent-2: #ffd1e8;
      --danger: #ff7b94;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(420px, 1fr) minmax(320px, 420px);
      gap: 14px;
      padding: 14px;
      overflow: hidden;
    }

    button, input, select {
      font: inherit;
    }

    .panel {
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .panel h1,
    .panel h2,
    .panel h3 {
      margin: 0;
    }

    .subtitle {
      margin: 6px 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar,
    .row,
    .row-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row-wrap { flex-wrap: wrap; }

    .toolbar {
      margin-bottom: 14px;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      background: rgba(255,255,255,.07);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    .btn:hover { background: rgba(255,255,255,.12); }
    .btn-primary { background: rgba(255,155,207,.17); }
    .btn-danger { color: #ffdbe4; border-color: rgba(255,123,148,.35); }
    .btn-mini { padding: 6px 8px; min-width: 34px; }

    .scene-shell {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 10px;
      background:
        radial-gradient(circle at center, rgba(255,155,207,.08), transparent 55%),
        #07050a;
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .stage-wrap {
      position: relative;
      height: min(92vh, 960px);
      aspect-ratio: 9 / 16;
      max-width: 100%;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 16px 50px rgba(0,0,0,.45);
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }

    .layer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform:
        translate(-50%, -50%)
        translate(var(--x-px, 0px), var(--y-px, 0px))
        rotate(var(--rotation, 0deg))
        scale(var(--scale, 1));
      transform-origin: center;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity, filter;
    }

    .layer.background {
      inset: 0;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform: none;
    }

    .layer > .motion {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .metal-shine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: var(--shine-opacity, .72);
      background: linear-gradient(
        115deg,
        transparent 15%,
        rgba(255,255,255,0) 35%,
        rgba(255,255,255,.95) 48%,
        rgba(255,221,238,.85) 53%,
        rgba(255,255,255,0) 66%,
        transparent 85%
      );
      background-size: 240% 100%;
      mix-blend-mode: screen;
      animation: metalSweep var(--shine-speed, 5s) ease-in-out infinite;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .firefly-field {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .firefly {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--left);
      top: var(--top);
      border-radius: 999px;
      background: radial-gradient(circle, #fffde8 0 18%, #fff3a8 28%, rgba(255,235,116,.38) 55%, transparent 74%);
      box-shadow:
        0 0 calc(var(--size) * .8) rgba(255,247,177,.95),
        0 0 calc(var(--size) * 2.2) rgba(216,255,151,.72);
      opacity: .2;
      animation:
        fireflyMove var(--fly-duration) ease-in-out infinite alternate,
        fireflyBlink var(--blink-duration) ease-in-out infinite;
      animation-delay: var(--delay);
      will-change: transform, opacity;
    }

    .layer img,
    .layer canvas {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .layer.background img,
    .layer.background canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card {
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .layer-card {
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      margin-bottom: 9px;
      background: rgba(255,255,255,.035);
    }

    .layer-card.active {
      border-color: rgba(255,155,207,.65);
      background: rgba(255,155,207,.08);
    }

    .layer-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .layer-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
      cursor: pointer;
    }

    .control {
      margin-bottom: 13px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 750;
    }

    .value {
      color: var(--accent-2);
      font-weight: 500;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="text"],
    input[type="number"],
    input[type="color"],
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 10px;
      background: #24172d;
      color: white;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .notice {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status {
      min-height: 18px;
      margin-top: 8px;
      color: var(--accent-2);
      font-size: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }

    .tab.active {
      background: rgba(255,155,207,.20);
      border-color: rgba(255,155,207,.55);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .hidden { display: none !important; }

    body.preview-mode {
      grid-template-columns: 1fr;
    }

    body.preview-mode .panel {
      display: none;
    }

    body.preview-mode .scene-shell {
      border: 0;
      background: #000;
      padding: 0;
    }

    body.preview-mode .stage-wrap {
      height: 100vh;
      border: 0;
      border-radius: 0;
    }

    .preview-exit {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
    }

    body.preview-mode .preview-exit {
      display: block;
    }

    /* Animaciones base */
    .anim-none { animation: none; }

    .anim-float {
      animation: float var(--duration, 8s) var(--easing, ease-in-out) infinite alternate;
    }

    .anim-drift {
      animation: drift var(--duration, 14s) var(--easing, ease-in-out) infinite alternate;
    }

    .anim-pulse {
      animation: pulse var(--duration, 8s) var(--easing, ease-in-out) infinite;
    }

    .anim-breathe {
      animation: breathe var(--duration, 10s) var(--easing, ease-in-out) infinite;
    }

    .anim-sway {
      animation: sway var(--duration, 7s) var(--easing, ease-in-out) infinite alternate;
    }

    .anim-fall {
      animation: fall var(--duration, 12s) linear infinite;
    }

    .anim-water {
      animation: water var(--duration, 10s) var(--easing, ease-in-out) infinite;
    }

    .anim-twinkle {
      animation: twinkle var(--duration, 4s) ease-in-out infinite;
    }

    .anim-plant {
      transform-origin: 50% 100%;
      animation: plantWind var(--duration, 7s) var(--easing, ease-in-out) infinite alternate;
    }

    .anim-ripple {
      transform-origin: 50% 60%;
      animation: ripple var(--duration, 6s) var(--easing, ease-in-out) infinite;
    }

    @keyframes float {
      from { transform: translateY(calc(var(--intensity, 8px) * -1)); }
      to { transform: translateY(var(--intensity, 8px)); }
    }

    @keyframes drift {
      from { transform: translateX(calc(var(--intensity, 12px) * -1)) scale(1.01); }
      to { transform: translateX(var(--intensity, 12px)) scale(1.03); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .72; }
      50% { transform: scale(calc(1 + var(--intensity-scale, .03))); opacity: 1; }
    }

    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50% { transform: scale(calc(1 + var(--intensity-scale, .025))); }
    }

    @keyframes sway {
      from { transform: rotate(calc(var(--intensity-deg, 2deg) * -1)); }
      to { transform: rotate(var(--intensity-deg, 2deg)); }
    }

    @keyframes fall {
      0% { transform: translateY(-120%) translateX(calc(var(--intensity, 20px) * -1)) rotate(-8deg); opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { transform: translateY(120%) translateX(var(--intensity, 20px)) rotate(10deg); opacity: 0; }
    }

    @keyframes water {
      0%,100% { transform: translateX(calc(var(--intensity, 8px) * -1)) scaleY(1); }
      50% { transform: translateX(var(--intensity, 8px)) scaleY(calc(1 + var(--intensity-scale, .02))); }
    }

    @keyframes twinkle {
      0%,100% { opacity: .35; transform: scale(.98); }
      50% { opacity: 1; transform: scale(calc(1 + var(--intensity-scale, .04))); }
    }

    @keyframes plantWind {
      0% { transform: rotate(calc(var(--intensity-deg, 2deg) * -.55)) skewX(-.35deg) scaleY(1); }
      45% { transform: rotate(calc(var(--intensity-deg, 2deg) * .25)) skewX(.25deg) scaleY(1.003); }
      100% { transform: rotate(var(--intensity-deg, 2deg)) skewX(.55deg) scaleY(.998); }
    }

    @keyframes ripple {
      0%,100% { transform: translateX(calc(var(--intensity, 8px) * -.45)) skewX(-.3deg) scaleY(1); }
      25% { transform: translateX(0) skewX(.25deg) scaleY(calc(1 + var(--intensity-scale, .015))); }
      50% { transform: translateX(calc(var(--intensity, 8px) * .45)) skewX(-.15deg) scaleY(.996); }
      75% { transform: translateX(0) skewX(.3deg) scaleY(calc(1 + var(--intensity-scale, .01))); }
    }

    @keyframes metalSweep {
      0%, 18% { background-position: 160% 0; opacity: 0; }
      34% { opacity: var(--shine-opacity, .72); }
      58% { background-position: -80% 0; opacity: var(--shine-opacity, .72); }
      72%, 100% { background-position: -80% 0; opacity: 0; }
    }

    @keyframes fireflyMove {
      0% { transform: translate3d(-8px, 8px, 0) scale(.75); }
      35% { transform: translate3d(16px, -12px, 0) scale(1); }
      70% { transform: translate3d(-13px, -23px, 0) scale(.86); }
      100% { transform: translate3d(24px, 10px, 0) scale(1.08); }
    }

    @keyframes fireflyBlink {
      0%,100% { opacity: .08; }
      38% { opacity: .92; }
      55% { opacity: .28; }
      75% { opacity: 1; }
    }

    body.paused .motion {
      animation-play-state: paused !important;
    }

    @media (max-width: 1180px) {
      body {
        grid-template-columns: minmax(300px, 380px) minmax(400px, 1fr);
      }
      .right-panel {
        position: fixed;
        right: 14px;
        top: 14px;
        bottom: 14px;
        width: min(92vw, 390px);
        z-index: 1000;
        box-shadow: 0 20px 60px rgba(0,0,0,.5);
      }
      .right-panel.closed { display: none; }
    }

    @media (max-width: 760px) {
      body {
        display: block;
        overflow: auto;
      }
      .left-panel,
      .right-panel {
        position: static;
        width: 100%;
        margin-bottom: 12px;
      }
      .scene-shell {
        min-height: 70vh;
      }
      .stage-wrap {
        width: min(94vw, 430px);
        height: auto;
      }
    }
  </style>
</head>

<body>
  <aside class="panel left-panel">
    <h1>🌸 MK Universe 2.0</h1>
    <p class="subtitle">Overlays vivos: neón, brillo metálico, plantas, agua y luciérnagas.</p>

    <div class="toolbar row-wrap">
      <button id="addImageBtn" class="btn btn-primary" type="button">➕ Imagen</button>
      <button id="addParticleBtn" class="btn" type="button">✨ Partículas</button>
      <button id="addFirefliesBtn" class="btn" type="button">🪲 Luciérnagas</button>
      <button id="pauseBtn" class="btn" type="button">⏸️ Pausar</button>
      <button id="previewBtn" class="btn" type="button">👁️ Vista limpia</button>
    </div>

    <input id="filePicker" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />

    <section class="card">
      <h3>Capas</h3>
      <p class="notice">Arrastra una capa para reordenarla o usa las flechas.</p>
      <div id="layersList"></div>
    </section>

    <section class="card">
      <h3>Proyecto</h3>
      <div class="row-wrap" style="margin-top:10px">
        <button id="saveBtn" class="btn" type="button">💾 Guardar</button>
        <button id="exportBtn" class="btn" type="button">📤 Exportar JSON</button>
        <button id="importBtn" class="btn" type="button">📥 Importar JSON</button>
        <button id="resetBtn" class="btn btn-danger" type="button">↩️ Restablecer</button>
      </div>
      <input id="jsonPicker" type="file" accept=".json,application/json" class="hidden" />
      <div id="projectStatus" class="status" aria-live="polite"></div>
    </section>
  </aside>

  <main class="scene-shell">
    <div class="stage-wrap">
      <div id="stage" aria-label="Escena vertical 1080 por 1920"></div>
    </div>
  </main>

  <aside class="panel right-panel" id="rightPanel">
    <div class="tabs">
      <button class="btn tab active" data-tab="transform" type="button">Transformar</button>
      <button class="btn tab" data-tab="appearance" type="button">Apariencia</button>
      <button class="btn tab" data-tab="animation" type="button">Animación</button>
    </div>

    <div id="emptyInspector" class="notice">
      Selecciona una capa para editarla.
    </div>

    <div id="inspector" class="hidden">
      <section class="tab-panel active" data-panel="transform">
        <div class="control">
          <label>Nombre</label>
          <input id="propName" type="text" />
        </div>

        <div class="control">
          <label for="propX">Posición X <span id="propXValue" class="value"></span></label>
          <input id="propX" type="range" min="-1000" max="1000" step="1" />
        </div>

        <div class="control">
          <label for="propY">Posición Y <span id="propYValue" class="value"></span></label>
          <input id="propY" type="range" min="-1800" max="1800" step="1" />
        </div>

        <div class="control">
          <label for="propScale">Escala <span id="propScaleValue" class="value"></span></label>
          <input id="propScale" type="range" min="5" max="300" step="1" />
        </div>

        <div class="control">
          <label for="propRotation">Rotación <span id="propRotationValue" class="value"></span></label>
          <input id="propRotation" type="range" min="-180" max="180" step="1" />
        </div>

        <div class="check-row">
          <input id="propVisible" type="checkbox" />
          <label for="propVisible">Mostrar capa</label>
        </div>

        <div class="check-row">
          <input id="propBackground" type="checkbox" />
          <label for="propBackground">Usar como fondo completo</label>
        </div>
      </section>

      <section class="tab-panel" data-panel="appearance">
        <div class="control">
          <label for="propOpacity">Opacidad <span id="propOpacityValue" class="value"></span></label>
          <input id="propOpacity" type="range" min="0" max="100" step="1" />
        </div>

        <div class="control">
          <label for="propBrightness">Brillo <span id="propBrightnessValue" class="value"></span></label>
          <input id="propBrightness" type="range" min="0" max="250" step="1" />
        </div>

        <div class="control">
          <label for="propContrast">Contraste <span id="propContrastValue" class="value"></span></label>
          <input id="propContrast" type="range" min="0" max="250" step="1" />
        </div>

        <div class="control">
          <label for="propSaturation">Saturación <span id="propSaturationValue" class="value"></span></label>
          <input id="propSaturation" type="range" min="0" max="250" step="1" />
        </div>

        <div class="card" style="margin-top:14px">
          <h3 style="margin-bottom:12px">✨ Luz y materiales</h3>

          <div class="check-row">
            <input id="propGlowEnabled" type="checkbox" />
            <label for="propGlowEnabled">Activar resplandor neón</label>
          </div>

          <div class="control">
            <label for="propGlowColor">Color del resplandor</label>
            <input id="propGlowColor" type="color" />
          </div>

          <div class="control">
            <label for="propGlowIntensity">Intensidad <span id="propGlowIntensityValue" class="value"></span></label>
            <input id="propGlowIntensity" type="range" min="0" max="100" step="1" />
          </div>

          <div class="control">
            <label for="propGlowBlur">Difuminado <span id="propGlowBlurValue" class="value"></span></label>
            <input id="propGlowBlur" type="range" min="0" max="80" step="1" />
          </div>

          <div class="control">
            <label for="propEdgeThickness">Borde luminoso <span id="propEdgeThicknessValue" class="value"></span></label>
            <input id="propEdgeThickness" type="range" min="0" max="20" step="1" />
          </div>

          <div class="control">
            <label for="propEmission">Emisión / núcleo de luz <span id="propEmissionValue" class="value"></span></label>
            <input id="propEmission" type="range" min="0" max="100" step="1" />
          </div>

          <div class="check-row">
            <input id="propMetalShine" type="checkbox" />
            <label for="propMetalShine">Brillo metálico animado</label>
          </div>

          <div class="control">
            <label for="propShineSpeed">Velocidad del brillo <span id="propShineSpeedValue" class="value"></span></label>
            <input id="propShineSpeed" type="range" min="1" max="20" step=".5" />
          </div>
        </div>

        <div class="control">
          <label for="propBlend">Modo de mezcla</label>
          <select id="propBlend">
            <option value="normal">Normal</option>
            <option value="screen">Pantalla / Screen</option>
            <option value="lighten">Aclarar</option>
            <option value="multiply">Multiplicar</option>
            <option value="overlay">Superponer</option>
            <option value="soft-light">Luz suave</option>
          </select>
        </div>

        <div class="check-row">
          <input id="propRemoveBlack" type="checkbox" />
          <label for="propRemoveBlack">Eliminar fondo negro</label>
        </div>

        <div class="control">
          <label for="propThreshold">Umbral negro <span id="propThresholdValue" class="value"></span></label>
          <input id="propThreshold" type="range" min="0" max="140" step="1" />
        </div>

        <div class="control">
          <label for="propFeather">Suavidad del borde <span id="propFeatherValue" class="value"></span></label>
          <input id="propFeather" type="range" min="1" max="160" step="1" />
        </div>
      </section>

      <section class="tab-panel" data-panel="animation">
        <div class="control">
          <label for="propAnimation">Tipo</label>
          <select id="propAnimation">
            <option value="none">Sin animación</option>
            <option value="float">Flotar</option>
            <option value="drift">Niebla / Deriva</option>
            <option value="pulse">Pulso de luz</option>
            <option value="breathe">Respirar</option>
            <option value="sway">Balanceo</option>
            <option value="fall">Caída</option>
            <option value="water">Agua</option>
            <option value="twinkle">Destello</option>
            <option value="plant">Hojas / planta con viento</option>
            <option value="ripple">Agua con olitas</option>
          </select>
        </div>

        <div class="control">
          <label for="propDuration">Duración <span id="propDurationValue" class="value"></span></label>
          <input id="propDuration" type="range" min="1" max="60" step="0.5" />
        </div>

        <div class="control">
          <label for="propIntensity">Intensidad <span id="propIntensityValue" class="value"></span></label>
          <input id="propIntensity" type="range" min="0" max="120" step="1" />
        </div>

        <div class="control">
          <label for="propPlasticity">Plasticidad <span id="propPlasticityValue" class="value"></span></label>
          <input id="propPlasticity" type="range" min="0" max="100" step="1" />
        </div>
      </section>

      <button id="deleteSelectedBtn" class="btn btn-danger" type="button" style="width:100%;margin-top:10px">
        🗑️ Eliminar capa seleccionada
      </button>
    </div>
  </aside>

  <button id="exitPreviewBtn" class="btn preview-exit" type="button">🎛️ Volver al editor</button>

  <script>
    const STORAGE_KEY = "mkUniverse2DEngine_v1";

    const defaultProject = {
      version: 1,
      selectedId: null,
      layers: []
    };

    let project = loadProject() || structuredClone(defaultProject);
    project.layers = (project.layers || []).map(layer => defaultLayer(layer));
    if (project.selectedId && !project.layers.some(layer => layer.id === project.selectedId)) {
      project.selectedId = null;
    }
    let dragId = null;

    const stage = document.getElementById("stage");
    const layersList = document.getElementById("layersList");
    const filePicker = document.getElementById("filePicker");
    const jsonPicker = document.getElementById("jsonPicker");
    const inspector = document.getElementById("inspector");
    const emptyInspector = document.getElementById("emptyInspector");
    const projectStatus = document.getElementById("projectStatus");

    const controls = {
      name: document.getElementById("propName"),
      x: document.getElementById("propX"),
      y: document.getElementById("propY"),
      scale: document.getElementById("propScale"),
      rotation: document.getElementById("propRotation"),
      visible: document.getElementById("propVisible"),
      background: document.getElementById("propBackground"),
      opacity: document.getElementById("propOpacity"),
      brightness: document.getElementById("propBrightness"),
      contrast: document.getElementById("propContrast"),
      saturation: document.getElementById("propSaturation"),
      blend: document.getElementById("propBlend"),
      removeBlack: document.getElementById("propRemoveBlack"),
      threshold: document.getElementById("propThreshold"),
      feather: document.getElementById("propFeather"),
      animation: document.getElementById("propAnimation"),
      duration: document.getElementById("propDuration"),
      intensity: document.getElementById("propIntensity"),
      plasticity: document.getElementById("propPlasticity"),
      glowEnabled: document.getElementById("propGlowEnabled"),
      glowColor: document.getElementById("propGlowColor"),
      glowIntensity: document.getElementById("propGlowIntensity"),
      glowBlur: document.getElementById("propGlowBlur"),
      edgeThickness: document.getElementById("propEdgeThickness"),
      emission: document.getElementById("propEmission"),
      metalShine: document.getElementById("propMetalShine"),
      shineSpeed: document.getElementById("propShineSpeed")
    };

    function newId(prefix = "layer") {
      return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function defaultLayer(overrides = {}) {
      return {
        id: newId(),
        name: "Nueva capa",
        kind: "image",
        src: "",
        visible: true,
        background: false,
        x: 0,
        y: 0,
        scale: 100,
        rotation: 0,
        opacity: 100,
        brightness: 100,
        contrast: 100,
        saturation: 100,
        blend: "normal",
        removeBlack: false,
        threshold: 12,
        feather: 40,
        animation: "none",
        duration: 10,
        intensity: 8,
        plasticity: 80,
        glowEnabled: false,
        glowColor: "#ff8fd1",
        glowIntensity: 35,
        glowBlur: 22,
        edgeThickness: 2,
        emission: 0,
        metalShine: false,
        shineSpeed: 6,
        ...overrides
      };
    }

    function loadProject() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveProject(message = "Proyecto guardado.") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
      projectStatus.textContent = message;
      setTimeout(() => {
        if (projectStatus.textContent === message) projectStatus.textContent = "";
      }, 1800);
    }

    function selectedLayer() {
      return project.layers.find(layer => layer.id === project.selectedId) || null;
    }

    function easingFromPlasticity(value) {
      if (value >= 85) return "cubic-bezier(.45,0,.55,1)";
      if (value >= 60) return "ease-in-out";
      if (value >= 35) return "ease";
      return "linear";
    }

    function renderAll() {
      renderStage();
      renderLayersList();
      renderInspector();
      saveProject("Cambios guardados automáticamente.");
    }

    function renderStage() {
      stage.innerHTML = "";

      project.layers.forEach((layer, index) => {
        const container = document.createElement("div");
        container.className = `layer${layer.background ? " background" : ""}`;
        container.dataset.id = layer.id;
        container.style.zIndex = index;
        container.style.display = layer.visible ? "block" : "none";
        container.style.width = layer.background ? "100%" : "100%";
        container.style.setProperty("--x-px", `${layer.x}px`);
        container.style.setProperty("--y-px", `${layer.y}px`);
        container.style.setProperty("--scale", layer.scale / 100);
        container.style.setProperty("--rotation", `${layer.rotation}deg`);
        container.style.mixBlendMode = layer.blend;

        const motion = document.createElement("div");
        motion.className = `motion anim-${layer.animation}`;
        motion.style.setProperty("--duration", `${layer.duration}s`);
        motion.style.setProperty("--intensity", `${layer.intensity}px`);
        motion.style.setProperty("--intensity-scale", layer.intensity / 100);
        motion.style.setProperty("--intensity-deg", `${Math.max(1, layer.intensity / 6)}deg`);
        motion.style.setProperty("--easing", easingFromPlasticity(layer.plasticity));

        if (layer.kind === "particles") {
          drawParticleLayer(layer, motion);
        } else {
          loadImageLayer(layer, motion);
        }

        container.appendChild(motion);
        stage.appendChild(container);
      });
    }

    function loadImageLayer(layer, motion) {
      const img = new Image();
      img.alt = layer.name;
      img.onload = () => {
        const visual = processImage(layer, img);
        styleVisual(layer, visual);
        motion.replaceChildren(visual);
        addMetalShine(layer, motion);
      };
      img.onerror = () => {
        const msg = document.createElement("div");
        msg.textContent = `No se pudo cargar: ${layer.name}`;
        msg.style.padding = "10px";
        msg.style.background = "rgba(150,30,70,.75)";
        msg.style.color = "white";
        motion.replaceChildren(msg);
      };
      img.src = layer.src;
    }

    function processImage(layer, img) {
      if (!layer.removeBlack) return img;

      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const threshold = Number(layer.threshold);
      const feather = Math.max(1, Number(layer.feather));

      for (let i = 0; i < data.length; i += 4) {
        const luminance = Math.max(data[i], data[i + 1], data[i + 2]);
        let alphaFactor = (luminance - threshold) / feather;
        alphaFactor = Math.min(1, Math.max(0, alphaFactor));
        alphaFactor = alphaFactor * alphaFactor * (3 - 2 * alphaFactor);
        data[i + 3] = Math.round(data[i + 3] * alphaFactor);
      }

      ctx.putImageData(imageData, 0, 0);
      return canvas;
    }

    function hexToRgba(hex, alpha = 1) {
      const clean = String(hex || "#ffffff").replace("#", "");
      const full = clean.length === 3
        ? clean.split("").map(char => char + char).join("")
        : clean.padEnd(6, "f").slice(0, 6);
      const value = Number.parseInt(full, 16);
      const r = (value >> 16) & 255;
      const g = (value >> 8) & 255;
      const b = value & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function styleVisual(layer, element) {
      element.style.opacity = layer.opacity / 100;

      const filters = [
        `brightness(${layer.brightness + (layer.emission || 0) * .45}%)`,
        `contrast(${layer.contrast}%)`,
        `saturate(${layer.saturation + (layer.emission || 0) * .25}%)`
      ];

      if (layer.glowEnabled) {
        const intensity = Math.max(0, Number(layer.glowIntensity || 0)) / 100;
        const blur = Math.max(0, Number(layer.glowBlur || 0));
        const edge = Math.max(0, Number(layer.edgeThickness || 0));
        const colorStrong = hexToRgba(layer.glowColor, Math.min(.98, .35 + intensity * .65));
        const colorSoft = hexToRgba(layer.glowColor, Math.min(.8, .12 + intensity * .58));

        if (edge > 0) {
          filters.push(`drop-shadow(${edge}px 0 0 ${colorStrong})`);
          filters.push(`drop-shadow(${-edge}px 0 0 ${colorStrong})`);
          filters.push(`drop-shadow(0 ${edge}px 0 ${colorStrong})`);
          filters.push(`drop-shadow(0 ${-edge}px 0 ${colorStrong})`);
        }

        if (blur > 0) {
          filters.push(`drop-shadow(0 0 ${Math.max(1, blur * .35)}px ${colorStrong})`);
          filters.push(`drop-shadow(0 0 ${Math.max(2, blur)}px ${colorSoft})`);
        }
      }

      element.style.filter = filters.join(" ");
    }

    function addMetalShine(layer, motion) {
      if (!layer.metalShine || layer.kind !== "image" || !layer.src) return;

      const shine = document.createElement("div");
      shine.className = "metal-shine";
      shine.style.setProperty("--shine-speed", `${Math.max(1, layer.shineSpeed || 6)}s`);
      shine.style.setProperty("--shine-opacity", Math.min(.95, .35 + (layer.emission || 0) / 150));
      shine.style.webkitMaskImage = `url("${layer.src}")`;
      shine.style.maskImage = `url("${layer.src}")`;
      motion.appendChild(shine);
    }

    function drawParticleLayer(layer, motion) {
      if ((layer.particleType || "") === "fireflies") {
        drawFireflies(layer, motion);
        return;
      }

      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1920;
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      const ctx = canvas.getContext("2d");

      const count = Math.max(8, Math.min(220, Math.round(layer.particleCount || 60)));
      const type = layer.particleType || "stars";
      const size = layer.particleSize || 9;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < count; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const s = size * (0.45 + Math.random() * 1.2);
        const a = 0.25 + Math.random() * 0.75;

        ctx.save();
        ctx.globalAlpha = a;

        if (type === "stars") {
          ctx.fillStyle = "white";
          ctx.beginPath();
          ctx.arc(x, y, s * 0.28, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "rgba(255,255,255,.8)";
          ctx.lineWidth = Math.max(1, s * 0.08);
          ctx.beginPath();
          ctx.moveTo(x - s, y);
          ctx.lineTo(x + s, y);
          ctx.moveTo(x, y - s);
          ctx.lineTo(x, y + s);
          ctx.stroke();
        } else if (type === "lights") {
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, s * 2.2);
          gradient.addColorStop(0, "rgba(255,245,220,.95)");
          gradient.addColorStop(.35, "rgba(255,195,225,.55)");
          gradient.addColorStop(1, "rgba(255,155,207,0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, s * 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.translate(x, y);
          ctx.rotate(Math.random() * Math.PI);
          ctx.fillStyle = "rgba(255,210,230,.92)";
          ctx.beginPath();
          ctx.ellipse(0, 0, s * .55, s, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      styleVisual(layer, canvas);
      motion.appendChild(canvas);
    }


    function drawFireflies(layer, motion) {
      const field = document.createElement("div");
      field.className = "firefly-field";

      const count = Math.max(4, Math.min(90, Number(layer.particleCount || 24)));
      const baseSize = Math.max(3, Number(layer.particleSize || 10));

      for (let i = 0; i < count; i++) {
        const dot = document.createElement("span");
        dot.className = "firefly";
        const size = baseSize * (.45 + Math.random() * 1.15);
        dot.style.setProperty("--size", `${size}px`);
        dot.style.setProperty("--left", `${4 + Math.random() * 92}%`);
        dot.style.setProperty("--top", `${8 + Math.random() * 84}%`);
        dot.style.setProperty("--fly-duration", `${4 + Math.random() * 7}s`);
        dot.style.setProperty("--blink-duration", `${1.6 + Math.random() * 3.6}s`);
        dot.style.setProperty("--delay", `${-Math.random() * 8}s`);
        field.appendChild(dot);
      }

      field.style.opacity = layer.opacity / 100;
      field.style.filter =
        `brightness(${layer.brightness}%) contrast(${layer.contrast}%) saturate(${layer.saturation}%)`;
      motion.appendChild(field);
    }

    function renderLayersList() {
      layersList.innerHTML = "";

      [...project.layers].reverse().forEach(layer => {
        const realIndex = project.layers.findIndex(item => item.id === layer.id);
        const card = document.createElement("div");
        card.className = `layer-card${project.selectedId === layer.id ? " active" : ""}`;
        card.draggable = true;
        card.dataset.id = layer.id;

        card.innerHTML = `
          <div class="layer-title">
            <span class="layer-name" title="${escapeHtml(layer.name)}">${escapeHtml(layer.name)}</span>
            <div class="row">
              <button class="btn btn-mini move-up" type="button" title="Adelante">▲</button>
              <button class="btn btn-mini move-down" type="button" title="Atrás">▼</button>
            </div>
          </div>
          <div class="row-wrap">
            <button class="btn btn-mini toggle-visible" type="button">${layer.visible ? "👁️" : "🚫"}</button>
            <button class="btn btn-mini duplicate" type="button">⧉</button>
            <button class="btn btn-mini btn-danger delete" type="button">🗑️</button>
          </div>
        `;

        card.querySelector(".layer-name").addEventListener("click", () => selectLayer(layer.id));
        card.addEventListener("click", event => {
          if (!event.target.closest("button")) selectLayer(layer.id);
        });

        card.querySelector(".move-up").addEventListener("click", () => {
          if (realIndex < project.layers.length - 1) {
            [project.layers[realIndex], project.layers[realIndex + 1]] =
              [project.layers[realIndex + 1], project.layers[realIndex]];
            renderAll();
          }
        });

        card.querySelector(".move-down").addEventListener("click", () => {
          if (realIndex > 0) {
            [project.layers[realIndex], project.layers[realIndex - 1]] =
              [project.layers[realIndex - 1], project.layers[realIndex]];
            renderAll();
          }
        });

        card.querySelector(".toggle-visible").addEventListener("click", () => {
          layer.visible = !layer.visible;
          renderAll();
        });

        card.querySelector(".duplicate").addEventListener("click", () => {
          const copy = structuredClone(layer);
          copy.id = newId();
          copy.name = `${layer.name} copia`;
          project.layers.splice(realIndex + 1, 0, copy);
          project.selectedId = copy.id;
          renderAll();
        });

        card.querySelector(".delete").addEventListener("click", () => deleteLayer(layer.id));

        card.addEventListener("dragstart", () => {
          dragId = layer.id;
        });

        card.addEventListener("dragover", event => {
          event.preventDefault();
        });

        card.addEventListener("drop", event => {
          event.preventDefault();
          if (!dragId || dragId === layer.id) return;

          const from = project.layers.findIndex(item => item.id === dragId);
          const to = project.layers.findIndex(item => item.id === layer.id);
          const [moved] = project.layers.splice(from, 1);
          project.layers.splice(to, 0, moved);
          dragId = null;
          renderAll();
        });

        layersList.appendChild(card);
      });
    }

    function renderInspector() {
      const layer = selectedLayer();

      if (!layer) {
        inspector.classList.add("hidden");
        emptyInspector.classList.remove("hidden");
        return;
      }

      inspector.classList.remove("hidden");
      emptyInspector.classList.add("hidden");

      controls.name.value = layer.name;
      controls.x.value = layer.x;
      controls.y.value = layer.y;
      controls.scale.value = layer.scale;
      controls.rotation.value = layer.rotation;
      controls.visible.checked = layer.visible;
      controls.background.checked = layer.background;
      controls.opacity.value = layer.opacity;
      controls.brightness.value = layer.brightness;
      controls.contrast.value = layer.contrast;
      controls.saturation.value = layer.saturation;
      controls.blend.value = layer.blend;
      controls.removeBlack.checked = layer.removeBlack;
      controls.threshold.value = layer.threshold;
      controls.feather.value = layer.feather;
      controls.animation.value = layer.animation;
      controls.duration.value = layer.duration;
      controls.intensity.value = layer.intensity;
      controls.plasticity.value = layer.plasticity;
      controls.glowEnabled.checked = Boolean(layer.glowEnabled);
      controls.glowColor.value = layer.glowColor || "#ff8fd1";
      controls.glowIntensity.value = layer.glowIntensity ?? 35;
      controls.glowBlur.value = layer.glowBlur ?? 22;
      controls.edgeThickness.value = layer.edgeThickness ?? 2;
      controls.emission.value = layer.emission ?? 0;
      controls.metalShine.checked = Boolean(layer.metalShine);
      controls.shineSpeed.value = layer.shineSpeed ?? 6;

      updateValueLabels(layer);
    }

    function updateValueLabels(layer) {
      const values = {
        propXValue: `${layer.x}px`,
        propYValue: `${layer.y}px`,
        propScaleValue: `${layer.scale}%`,
        propRotationValue: `${layer.rotation}°`,
        propOpacityValue: `${layer.opacity}%`,
        propBrightnessValue: `${layer.brightness}%`,
        propContrastValue: `${layer.contrast}%`,
        propSaturationValue: `${layer.saturation}%`,
        propThresholdValue: `${layer.threshold}`,
        propFeatherValue: `${layer.feather}`,
        propDurationValue: `${layer.duration}s`,
        propIntensityValue: `${layer.intensity}`,
        propPlasticityValue: `${layer.plasticity}%`,
        propGlowIntensityValue: `${layer.glowIntensity ?? 35}%`,
        propGlowBlurValue: `${layer.glowBlur ?? 22}px`,
        propEdgeThicknessValue: `${layer.edgeThickness ?? 2}px`,
        propEmissionValue: `${layer.emission ?? 0}%`,
        propShineSpeedValue: `${layer.shineSpeed ?? 6}s`
      };

      Object.entries(values).forEach(([id, text]) => {
        document.getElementById(id).textContent = text;
      });
    }

    function selectLayer(id) {
      project.selectedId = id;
      renderLayersList();
      renderInspector();
      saveProject("Capa seleccionada.");
    }

    function deleteLayer(id) {
      const layer = project.layers.find(item => item.id === id);
      if (!layer) return;
      if (!confirm(`¿Eliminar la capa "${layer.name}"?`)) return;

      project.layers = project.layers.filter(item => item.id !== id);
      if (project.selectedId === id) project.selectedId = null;
      renderAll();
    }

    function bindInspector() {
      const map = {
        name: "name",
        x: "x",
        y: "y",
        scale: "scale",
        rotation: "rotation",
        visible: "visible",
        background: "background",
        opacity: "opacity",
        brightness: "brightness",
        contrast: "contrast",
        saturation: "saturation",
        blend: "blend",
        removeBlack: "removeBlack",
        threshold: "threshold",
        feather: "feather",
        animation: "animation",
        duration: "duration",
        intensity: "intensity",
        plasticity: "plasticity",
        glowEnabled: "glowEnabled",
        glowColor: "glowColor",
        glowIntensity: "glowIntensity",
        glowBlur: "glowBlur",
        edgeThickness: "edgeThickness",
        emission: "emission",
        metalShine: "metalShine",
        shineSpeed: "shineSpeed"
      };

      Object.entries(controls).forEach(([key, control]) => {
        const handler = () => {
          const layer = selectedLayer();
          if (!layer) return;

          const prop = map[key];
          if (control.type === "checkbox") {
            layer[prop] = control.checked;
          } else if (control.type === "range") {
            layer[prop] = Number(control.value);
          } else {
            layer[prop] = control.value;
          }

          renderStage();
          renderLayersList();
          renderInspector();
          saveProject();
        };

        control.addEventListener(control.type === "text" ? "change" : "input", handler);
        control.addEventListener("change", handler);
      });
    }

    function addImageFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const layer = defaultLayer({
          name: file.name.replace(/\.[^.]+$/, ""),
          src: reader.result,
          kind: "image"
        });
        project.layers.push(layer);
        project.selectedId = layer.id;
        renderAll();
      };
      reader.readAsDataURL(file);
    }

    function addParticleLayer() {
      const type = prompt("Tipo de partícula: stars, lights, petals o fireflies", "stars");
      if (!type) return;

      const cleanType = ["stars", "lights", "petals", "fireflies"].includes(type.toLowerCase())
        ? type.toLowerCase()
        : "stars";

      const layer = defaultLayer({
        name:
          cleanType === "stars" ? "Estrellas" :
          cleanType === "lights" ? "Luces" :
          cleanType === "fireflies" ? "Luciérnagas" :
          "Pétalos",
        kind: "particles",
        particleType: cleanType,
        particleCount: cleanType === "petals" ? 36 : cleanType === "fireflies" ? 24 : 70,
        particleSize: cleanType === "lights" ? 14 : cleanType === "fireflies" ? 11 : 8,
        background: true,
        animation:
          cleanType === "stars" ? "twinkle" :
          cleanType === "lights" ? "pulse" :
          cleanType === "fireflies" ? "none" :
          "fall",
        duration:
          cleanType === "petals" ? 16 :
          cleanType === "lights" ? 8 :
          cleanType === "fireflies" ? 6 :
          5,
        intensity:
          cleanType === "petals" ? 28 :
          cleanType === "lights" ? 3 :
          4,
        opacity: cleanType === "lights" ? 55 : 80,
        blend: cleanType === "lights" ? "screen" : "normal"
      });

      project.layers.push(layer);
      project.selectedId = layer.id;
      renderAll();
    }


    function addFirefliesLayer() {
      const layer = defaultLayer({
        name: "Luciérnagas",
        kind: "particles",
        particleType: "fireflies",
        particleCount: 24,
        particleSize: 11,
        background: true,
        animation: "none",
        duration: 6,
        intensity: 12,
        opacity: 88,
        blend: "screen",
        glowEnabled: true,
        glowColor: "#eaff9a",
        glowIntensity: 55,
        glowBlur: 18
      });
      project.layers.push(layer);
      project.selectedId = layer.id;
      renderAll();
    }

    function exportProject() {
      const blob = new Blob([JSON.stringify(project, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "mk-universe-project.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function importProject(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed.layers)) throw new Error("Formato inválido");
          project = parsed;
          renderAll();
          projectStatus.textContent = "Proyecto importado.";
        } catch {
          projectStatus.textContent = "No se pudo importar el archivo.";
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("addImageBtn").addEventListener("click", () => filePicker.click());
    filePicker.addEventListener("change", () => {
      addImageFile(filePicker.files[0]);
      filePicker.value = "";
    });

    document.getElementById("addParticleBtn").addEventListener("click", addParticleLayer);
    document.getElementById("addFirefliesBtn").addEventListener("click", addFirefliesLayer);

    document.getElementById("pauseBtn").addEventListener("click", event => {
      document.body.classList.toggle("paused");
      event.currentTarget.textContent =
        document.body.classList.contains("paused") ? "▶️ Reanudar" : "⏸️ Pausar";
    });

    document.getElementById("previewBtn").addEventListener("click", () => {
      document.body.classList.add("preview-mode");
    });

    document.getElementById("exitPreviewBtn").addEventListener("click", () => {
      document.body.classList.remove("preview-mode");
    });

    document.getElementById("saveBtn").addEventListener("click", () => saveProject());
    document.getElementById("exportBtn").addEventListener("click", exportProject);
    document.getElementById("importBtn").addEventListener("click", () => jsonPicker.click());
    jsonPicker.addEventListener("change", () => {
      importProject(jsonPicker.files[0]);
      jsonPicker.value = "";
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("¿Borrar todas las capas y comenzar de cero?")) return;
      project = structuredClone(defaultProject);
      renderAll();
    });

    document.getElementById("deleteSelectedBtn").addEventListener("click", () => {
      const layer = selectedLayer();
      if (layer) deleteLayer(layer.id);
    });

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(panel => panel.classList.remove("active"));
        button.classList.add("active");
        document.querySelector(`[data-panel="${button.dataset.tab}"]`).classList.add("active");
      });
    });

    bindInspector();
    renderAll();
  </script>
</body>
</html>
