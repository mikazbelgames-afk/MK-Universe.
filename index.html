<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Universe Vertical</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .escenario {
            position: relative;
            height: 100vh;
            aspect-ratio: 9 / 16;
            max-width: 100vw;
            overflow: hidden;
            background: black;
        }

        .capa {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <main class="escenario">
        <img
            class="capa"
            src="Atardecer abstracto y suave.png"
            alt="Gradiente MK Universe"
        >
    </main>

</body>

</html>
